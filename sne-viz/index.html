<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>I11 gas + supernovae</title>
<style>
  :root {
    /* Each canvas is square. Cap by display width and by remaining vertical
       space so the whole widget fits in the viewport on landscape phones. */
    --canvas-side: min(600px, 46vw, calc(100vh - 140px));
  }
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #111; color: #ddd;
         margin: 0; padding: 12px; }
  h1 { font-size: 18px; margin: 0 0 10px 0; }
  .row { display: flex; flex-direction: row; gap: 10px; align-items: flex-start;
         flex-wrap: wrap; }
  .panel { background: #000; border: 1px solid #333; padding: 4px; border-radius: 4px; }
  canvas#main { width: var(--canvas-side); height: var(--canvas-side);
                cursor: grab; display: block; touch-action: none; }
  canvas#zoom { width: var(--canvas-side); height: var(--canvas-side);
                display: block; touch-action: none; }
  .label { font-size: 12px; color: #888; padding: 4px 0 0 4px; }
  .controls { margin-top: 12px; display: flex; gap: 12px; align-items: center;
              flex-wrap: wrap; max-width: 1180px; }
  @media (max-height: 480px) {
    body { padding: 6px; }
    h1 { font-size: 14px; margin: 0 0 6px 0; }
    :root { --canvas-side: min(600px, 46vw, calc(100vh - 96px)); }
    .controls { margin-top: 6px; gap: 8px; font-size: 12px; }
  }
  #frame { flex: 1; }
  button { background: #2a2a2a; color: #ddd; border: 1px solid #444; padding: 6px 12px;
           border-radius: 3px; cursor: pointer; }
  button:hover { background: #3a3a3a; }
  #frameLabel { font-variant-numeric: tabular-nums; min-width: 60px; }
  #status { font-size: 12px; color: #888; margin-top: 8px; }
  .toggle { display: flex; align-items: center; gap: 6px; user-select: none; cursor: pointer; }
  .toggle input { cursor: pointer; }
  .toggle select { background: #2a2a2a; color: #ddd; border: 1px solid #444;
                    padding: 4px 6px; border-radius: 3px; cursor: pointer; }
  .panel { position: relative; }
  .loading-overlay { position: absolute; inset: 4px; display: flex; flex-direction: column;
                     align-items: center; justify-content: center; gap: 12px;
                     background: rgba(0,0,0,0.65); color: #ddd; font-size: 14px;
                     pointer-events: none; transition: opacity 0.2s; }
  .loading-overlay.hidden { opacity: 0; }
  .spinner { width: 36px; height: 36px; border: 3px solid #444; border-top-color: #ffdd33;
             border-radius: 50%; animation: spin 0.9s linear infinite; }
  #miniProgress { display: flex; align-items: center; gap: 8px; margin-top: 6px;
                  font-size: 11px; color: #888; transition: opacity 0.3s; }
  #miniProgress.hidden { opacity: 0; pointer-events: none; }
  #miniBarTrack { width: 160px; height: 4px; background: #333; border-radius: 2px; overflow: hidden; }
  #miniBarTrack > div { height: 100%; background: #ffdd33; width: 0%; transition: width 0.15s linear; }
  #zoomCoord { position: absolute; right: 4px; bottom: 4px; font-size: 12px;
               color: #888; font-variant-numeric: tabular-nums;
               pointer-events: none; opacity: 0; transition: opacity 0.1s; }
  #zoomCoord.visible { opacity: 1; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<h1>I11 gas column density + supernovae</h1>
<div class="row">
  <div class="panel">
    <canvas id="main" width="600" height="600"></canvas>
    <div id="loading" class="loading-overlay">
      <div class="spinner"></div>
      <div id="loadingText">loading…</div>
    </div>
    <div class="label">Main view (drag the white rectangle)</div>
  </div>
  <div class="panel zoom">
    <canvas id="zoom" width="520" height="520"></canvas>
    <div id="zoomCoord"></div>
    <div class="label" id="zoomLabel">Zoom</div>
  </div>
</div>
<div class="controls">
  <button id="play">Play</button>
  <label class="toggle">speed:
    <input id="speed" type="range" min="1" max="30" value="5" step="1">
    <span id="speedLabel">5 fps</span>
  </label>
  <label class="toggle"><input id="corotate" type="checkbox" checked> co-rotate inset</label>
  <label class="toggle"><input id="rotate" type="checkbox"> aim inset at center</label>
  <label class="toggle">background:
    <select id="background"></select>
  </label>
  <span id="frameLabel">020</span>
  <input id="frame" type="range" min="20" max="519" value="20" step="1">
</div>
<div id="status">loading…</div>
<div id="miniProgress" class="hidden">
  <span id="miniBarText"></span>
  <div id="miniBarTrack"><div id="miniBarFill"></div></div>
</div>

<script>
(() => {
  const FOV = 30.0;
  const HALF = FOV / 2.0;
  const EXTENT = [-HALF, HALF, -HALF, HALF];
  const NPIX = 512;
  // Number of frames over which an SN dot fades out. Overridden from
  // meta.json.fade during loadSne() so it tracks the export's SNE_FADE.
  let SNE_FADE = 3;
  const MAIN_PX = 600, ZOOM_PX = 520;
  // Each background ID maps to a frames subdirectory under site/.
  // Populated dynamically from meta.json.backgrounds during bootstrap.
  let BG_DIRS = {};
  let BG_LABELS = {};
  let bgId = 'gas';
  const FRAME_FMT = (dir, n) => dir + '/frame_' + String(n).padStart(3, '0') + '.png';

  const mainCv = document.getElementById('main');
  const zoomCv = document.getElementById('zoom');
  const mainCtx = mainCv.getContext('2d');
  const zoomCtx = zoomCv.getContext('2d');
  mainCtx.imageSmoothingEnabled = false;
  zoomCtx.imageSmoothingEnabled = true;
  const slider = document.getElementById('frame');
  const frameLabel = document.getElementById('frameLabel');
  const playBtn = document.getElementById('play');
  const corotateBox = document.getElementById('corotate');
  const rotateBox = document.getElementById('rotate');
  const zoomLabel = document.getElementById('zoomLabel');
  const status = document.getElementById('status');

  let fmin = 20, fmax = 519;
  let frameIdx = fmin;
  // Optional slot -> true snapshot number map (for decimated/strided exports).
  // When present, the on-disk frames are contiguous slots and this gives the
  // real snapshot number to display for each slot.
  let frameNumbers = null;
  const frameLabelText = (idx) =>
    String(frameNumbers ? frameNumbers[idx - fmin] : idx).padStart(3, '0');
  let rect = { x0: -14, y0: -5, x1: -10, y1: -1 };  // kpc
  // Flat per-frame data sliced via offsets: sneXs/Ys are float32, sneAges is uint8.
  // For frame f, rows are [offsets[f-fmin] .. offsets[f-fmin+1]).
  let sneXs = null, sneYs = null, sneAges = null, sneOffsets = null;
  // Per-background image caches: { <bgId>: {idx: Image}, ... }. Populated after meta load.
  let frameCaches = {};
  let loadedCounts = {};
  let frames = {};

  // Spinner overlay covers the figure only until this many frames of the active
  // background are decoded; after that the figure is interactive and remaining
  // frames stream in behind a small progress bar.
  const INITIAL_FRAMES = 50;
  const loadingEl = document.getElementById('loading');
  const miniEl = document.getElementById('miniProgress');
  const miniText = document.getElementById('miniBarText');
  const miniFill = document.getElementById('miniBarFill');
  function updateLoadingUI() {
    const total = fmax - fmin + 1;
    const n = loadedCounts[bgId] || 0;
    const initialTarget = Math.min(INITIAL_FRAMES, total);
    // Full spinner overlay: only during the initial burst.
    loadingEl.classList.toggle('hidden', n >= initialTarget);
    // Small progress bar: visible until the active background is fully loaded.
    if (n >= total) {
      miniEl.classList.add('hidden');
    } else {
      miniEl.classList.remove('hidden');
      const label = BG_LABELS[bgId] || bgId;
      miniText.textContent = `loading ${label} ${n}/${total}`;
      miniFill.style.width = (100 * n / total).toFixed(1) + '%';
    }
  }
  let playing = false;
  let playTimer = null;

  // Rotation curve: parallel arrays r[] and dphi[] in radians/frame.
  let rotR = null, rotDphi = null;
  let lastFrame = null;

  // ---- coordinate helpers ----------------------------------------------------
  // Main canvas: kpc -> px (origin top-left, y axis flipped to match physics).
  const kpcToMainX = (x) => ((x - EXTENT[0]) / FOV) * MAIN_PX;
  const kpcToMainY = (y) => ((EXTENT[3] - y) / FOV) * MAIN_PX;
  const mainXToKpc = (px) => EXTENT[0] + (px / MAIN_PX) * FOV;
  const mainYToKpc = (py) => EXTENT[3] - (py / MAIN_PX) * FOV;

  // Source image pixel coords for ctx.drawImage cropping.
  const kpcToSrcX = (x) => ((x - EXTENT[0]) / FOV) * NPIX;
  const kpcToSrcY = (y) => ((EXTENT[3] - y) / FOV) * NPIX;

  // ---- zoom transform --------------------------------------------------------
  // Maps the inset square (kpc) into the square zoom canvas. With "aim inset at
  // center" off, alpha=0 and this is the plain axis-aligned crop. With it on,
  // the content is rotated so the panel's BOTTOM edge points toward the galaxy
  // center (0,0): the inset square is tilted in the main view to match.
  // Cached each render() into curXform; recomputed on demand for the cursor.
  let curXform = null;
  function computeXform() {
    const cx = (rect.x0 + rect.x1) / 2;
    const cy = (rect.y0 + rect.y1) / 2;
    const w = Math.abs(rect.x1 - rect.x0);          // inset side (kpc, square)
    const sideSrc = (w / FOV) * NPIX;               // ...in source px
    const scale = sideSrc > 0 ? ZOOM_PX / sideSrc : 1;
    const scx = kpcToSrcX(cx), scy = kpcToSrcY(cy); // inset center in source px
    // Default-zoom "down" = south; we want "down" to point toward center.
    const alpha = rotateBox.checked
      ? (Math.PI / 2 - Math.atan2(cy, -cx)) : 0;
    return { cx, cy, scale, scx, scy, alpha,
             cos: Math.cos(alpha), sin: Math.sin(alpha) };
  }
  // kpc -> zoom-canvas px under transform t (rotation [c -s; s c]).
  function kpcToZoomPx(x, y, t) {
    const X = (kpcToSrcX(x) - t.scx) * t.scale;
    const Y = (kpcToSrcY(y) - t.scy) * t.scale;
    return { px: X * t.cos - Y * t.sin + ZOOM_PX / 2,
             py: X * t.sin + Y * t.cos + ZOOM_PX / 2 };
  }
  // zoom-canvas px -> kpc (inverse of the above; rotation transpose [c s; -s c]).
  function zoomPxToKpc(px, py, t) {
    const rx = px - ZOOM_PX / 2, ry = py - ZOOM_PX / 2;
    const X = (rx * t.cos + ry * t.sin) / t.scale + t.scx;
    const Y = (-rx * t.sin + ry * t.cos) / t.scale + t.scy;
    return { x: EXTENT[0] + (X / NPIX) * FOV,
             y: EXTENT[3] - (Y / NPIX) * FOV };
  }
  // Main-canvas px -> inset-local px (origin at inset center, axes aligned with
  // the tilted square). The main view draws the inset rotated by -alpha, so we
  // undo it with +alpha here. Reduces to a plain offset when alpha=0. Used for
  // hit-testing so the resize handles track the displayed square.
  function toLocalPx(px, py, t) {
    const dx = px - kpcToMainX(t.cx);
    const dy = py - kpcToMainY(t.cy);
    return { lx: dx * t.cos - dy * t.sin, ly: dx * t.sin + dy * t.cos };
  }

  // ---- frame loading ---------------------------------------------------------
  function preloadFrames(which) {
    const dir = BG_DIRS[which];
    const cache = frameCaches[which];
    const total = fmax - fmin + 1;
    const onDone = () => {
      loadedCounts[which]++;
      if (which === bgId) {
        updateLoadingUI();
        if (loadedCounts[which] % 50 === 0 || loadedCounts[which] === total) {
          status.textContent = `loaded ${loadedCounts[which]}/${total} ${which} frames`;
        }
        if (loadedCounts[which] === total) {
          const nSne = sneXs ? sneXs.length : 0;
          status.textContent = `${total} frames + ${nSne} active SN entries ready`;
        }
      }
    };
    for (let i = fmin; i <= fmax; i++) {
      if (cache[i]) continue;
      const idx = i;
      const img = new Image();
      img.decoding = 'async';
      img.onload = () => {
        onDone();
        if (which === bgId && idx === frameIdx) render();
      };
      img.onerror = onDone;
      img.src = FRAME_FMT(dir, i);
      cache[i] = img;
    }
    updateLoadingUI();
  }

  // ---- rotation curve --------------------------------------------------------
  async function loadRotation() {
    try {
      const r = await fetch('rotation.json');
      const data = await r.json();
      rotR = data.r_centers_kpc;
      rotDphi = data.dphi_per_frame;
    } catch (e) {
      console.warn('rotation.json not found; co-rotation disabled');
      rotR = rotDphi = null;
      corotateBox.disabled = true;
    }
  }

  function dphiAt(R) {
    if (!rotR || rotR.length === 0) return 0;
    if (R <= rotR[0]) return rotDphi[0];
    if (R >= rotR[rotR.length - 1]) return rotDphi[rotDphi.length - 1];
    // Linear interpolation in the table.
    let lo = 0, hi = rotR.length - 1;
    while (hi - lo > 1) {
      const mid = (lo + hi) >> 1;
      if (rotR[mid] <= R) lo = mid; else hi = mid;
    }
    const t = (R - rotR[lo]) / (rotR[hi] - rotR[lo]);
    return rotDphi[lo] + t * (rotDphi[hi] - rotDphi[lo]);
  }

  // Rotate the inset center by Σ dphi(R) over `df` frames (df may be negative).
  // For each unit step we re-evaluate dphi at the current R, since R may shift
  // slightly during the integration.
  function applyCorotation(df) {
    if (!corotateBox.checked) return;
    if (df === 0 || !rotR) return;
    const cx0 = (rect.x0 + rect.x1) / 2;
    const cy0 = (rect.y0 + rect.y1) / 2;
    const w = rect.x1 - rect.x0;
    const h = rect.y1 - rect.y0;
    let cx = cx0, cy = cy0;
    const steps = Math.abs(df);
    const dir = Math.sign(df);
    for (let k = 0; k < steps; k++) {
      const R = Math.hypot(cx, cy);
      const a = dphiAt(R) * dir;
      const c = Math.cos(a), s = Math.sin(a);
      const nx = c * cx - s * cy;
      const ny = s * cx + c * cy;
      cx = nx; cy = ny;
    }
    // Clamp the new center so the rectangle stays inside the FOV.
    cx = clamp(cx, EXTENT[0] + w / 2, EXTENT[1] - w / 2);
    cy = clamp(cy, EXTENT[2] + h / 2, EXTENT[3] - h / 2);
    rect = { x0: cx - w / 2, y0: cy - h / 2, x1: cx + w / 2, y1: cy + h / 2 };
  }

  // ---- SNe loading -----------------------------------------------------------
  async function loadSne() {
    try {
      const meta = await (await fetch('meta.json')).json();
      fmin = meta.fmin; fmax = meta.fmax;
      if (meta.fade > 0) SNE_FADE = meta.fade;
      frameNumbers = (meta.frame_numbers && meta.frame_numbers.length)
        ? meta.frame_numbers : null;
      slider.min = fmin; slider.max = fmax; slider.value = fmin;
      frameIdx = fmin;
      frameLabel.textContent = frameLabelText(fmin);

      // Build background registry + populate dropdown from meta.
      const bgs = (meta.backgrounds && meta.backgrounds.length)
        ? meta.backgrounds
        : [{ id: 'gas', label: 'Gas column density', frames_dir: 'frames' }];
      BG_DIRS = {}; BG_LABELS = {};
      frameCaches = {}; loadedCounts = {};
      bgSelect.innerHTML = '';
      for (const b of bgs) {
        BG_DIRS[b.id] = b.frames_dir;
        BG_LABELS[b.id] = b.label;
        frameCaches[b.id] = {};
        loadedCounts[b.id] = 0;
        const opt = document.createElement('option');
        opt.value = b.id; opt.textContent = b.label;
        bgSelect.appendChild(opt);
      }
      if (!BG_DIRS[bgId]) bgId = bgs[0].id;
      bgSelect.value = bgId;
      frames = frameCaches[bgId];

      const [xb, yb, ab, ob] = await Promise.all([
        fetch(meta.files.x).then(r => r.arrayBuffer()),
        fetch(meta.files.y).then(r => r.arrayBuffer()),
        fetch(meta.files.age).then(r => r.arrayBuffer()),
        fetch(meta.files.offsets).then(r => r.arrayBuffer()),
      ]);
      sneXs = new Float32Array(xb);
      sneYs = new Float32Array(yb);
      sneAges = new Uint8Array(ab);
      sneOffsets = new Int32Array(ob);
    } catch (e) {
      console.error('SNe load failed', e);
      sneXs = sneYs = sneAges = sneOffsets = null;
    }
  }

  // ---- rendering -------------------------------------------------------------
  function drawSneZoom(t) {
    if (!sneOffsets) return;
    const i0 = sneOffsets[frameIdx - fmin];
    const i1 = sneOffsets[frameIdx - fmin + 1];
    for (let i = i0; i < i1; i++) {
      const p = kpcToZoomPx(sneXs[i], sneYs[i], t);
      if (p.px < 0 || p.px > ZOOM_PX || p.py < 0 || p.py > ZOOM_PX) continue;
      const age = sneAges[i];
      const a = (SNE_FADE - age) / SNE_FADE;
      zoomCtx.fillStyle = `rgba(255,221,51,${a.toFixed(3)})`;
      zoomCtx.beginPath();
      zoomCtx.arc(p.px, p.py, 3, 0, Math.PI * 2);
      zoomCtx.fill();
    }
  }

  // Inset outline on the main canvas, tilted by -alpha so its bottom edge
  // (= zoom panel bottom) faces the galaxy center when "aim inset" is on.
  function drawRect(t) {
    const wp = (Math.abs(rect.x1 - rect.x0) / FOV) * MAIN_PX;
    const hp = (Math.abs(rect.y1 - rect.y0) / FOV) * MAIN_PX;
    mainCtx.save();
    mainCtx.translate(kpcToMainX(t.cx), kpcToMainY(t.cy));
    mainCtx.rotate(-t.alpha);
    mainCtx.strokeStyle = '#ffffff';
    mainCtx.lineWidth = 2;
    mainCtx.strokeRect(-wp / 2, -hp / 2, wp, hp);
    mainCtx.restore();
  }

  function render() {
    const img = frames[frameIdx];
    const t = curXform = computeXform();
    mainCtx.fillStyle = '#000';
    mainCtx.fillRect(0, 0, MAIN_PX, MAIN_PX);
    if (img && img.complete && img.naturalWidth > 0) {
      mainCtx.drawImage(img, 0, 0, MAIN_PX, MAIN_PX);
    }
    drawRect(t);

    // Zoom: map the inset square into the panel (rotated when "aim inset" is on).
    zoomCtx.fillStyle = '#000';
    zoomCtx.fillRect(0, 0, ZOOM_PX, ZOOM_PX);
    if (img && img.complete && img.naturalWidth > 0) {
      zoomCtx.save();
      zoomCtx.translate(ZOOM_PX / 2, ZOOM_PX / 2);
      zoomCtx.rotate(t.alpha);
      zoomCtx.scale(t.scale, t.scale);
      zoomCtx.translate(-t.scx, -t.scy);
      zoomCtx.drawImage(img, 0, 0);
      zoomCtx.restore();
    }
    drawSneZoom(t);

    frameLabel.textContent = frameLabelText(frameIdx);
    zoomLabel.textContent = `Zoom (${rect.x0.toFixed(1)}, ${rect.y0.toFixed(1)}) → (${rect.x1.toFixed(1)}, ${rect.y1.toFixed(1)}) kpc`;
  }

  // ---- mouse interaction on main canvas -------------------------------------
  let drag = null;  // { mode: 'move'|'nw'|'ne'|'sw'|'se'|'n'|'s'|'e'|'w', start: {...} }
  // Larger hit region on touch devices where fingers are less precise.
  const HANDLE_PX = window.matchMedia('(pointer: coarse)').matches ? 24 : 10;

  function hitTest(px, py) {
    // Test in the inset's local frame so handles follow the displayed square
    // even when it is tilted (alpha != 0).
    const t = curXform || computeXform();
    const { lx, ly } = toLocalPx(px, py, t);
    const half = (Math.abs(rect.x1 - rect.x0) / FOV) * MAIN_PX / 2;
    const ax = Math.abs(lx), ay = Math.abs(ly);
    if (ax > half + HANDLE_PX || ay > half + HANDLE_PX) return null;
    const onV = Math.abs(ax - half) < HANDLE_PX;   // near a vertical (left/right) edge
    const onH = Math.abs(ay - half) < HANDLE_PX;   // near a horizontal (top/bottom) edge
    const left = onV && lx < 0, right = onV && lx > 0;
    const top  = onH && ly < 0, bot   = onH && ly > 0;
    if (top && left) return 'nw';
    if (top && right) return 'ne';
    if (bot && left) return 'sw';
    if (bot && right) return 'se';
    if (top) return 'n';
    if (bot) return 's';
    if (left) return 'w';
    if (right) return 'e';
    if (ax < half && ay < half) return 'move';
    return null;
  }

  function cursorFor(mode) {
    return {
      'move': 'grab', 'n': 'ns-resize', 's': 'ns-resize',
      'e': 'ew-resize', 'w': 'ew-resize',
      'nw': 'nwse-resize', 'se': 'nwse-resize',
      'ne': 'nesw-resize', 'sw': 'nesw-resize',
    }[mode] || 'crosshair';
  }

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  // Convert a pointer event's client coordinates to logical canvas pixels,
  // since CSS may scale the canvas to fit the viewport.
  function canvasPx(cv, e) {
    const r = cv.getBoundingClientRect();
    return {
      px: (e.clientX - r.left) * cv.width / r.width,
      py: (e.clientY - r.top) * cv.height / r.height,
    };
  }

  mainCv.addEventListener('pointermove', (e) => {
    const { px, py } = canvasPx(mainCv, e);
    if (!drag) {
      mainCv.style.cursor = cursorFor(hitTest(px, py));
      return;
    }
    const x = clamp(mainXToKpc(px), EXTENT[0], EXTENT[1]);
    const y = clamp(mainYToKpc(py), EXTENT[2], EXTENT[3]);
    const s = drag.start;
    if (drag.mode === 'move') {
      const dx = x - s.x, dy = y - s.y;
      let nx0 = s.r.x0 + dx, nx1 = s.r.x1 + dx;
      let ny0 = s.r.y0 + dy, ny1 = s.r.y1 + dy;
      const w = nx1 - nx0, h = ny1 - ny0;
      if (nx0 < EXTENT[0]) { nx0 = EXTENT[0]; nx1 = nx0 + w; }
      if (nx1 > EXTENT[1]) { nx1 = EXTENT[1]; nx0 = nx1 - w; }
      if (ny0 < EXTENT[2]) { ny0 = EXTENT[2]; ny1 = ny0 + h; }
      if (ny1 > EXTENT[3]) { ny1 = EXTENT[3]; ny0 = ny1 - h; }
      rect = { x0: nx0, y0: ny0, x1: nx1, y1: ny1 };
    } else {
      // Symmetric resize about the (fixed) center, measured in the inset's local
      // frame so it behaves identically whether or not the inset is rotated.
      const t = curXform || computeXform();
      const { lx, ly } = toLocalPx(px, py, t);
      let halfPx;
      if (drag.mode === 'e' || drag.mode === 'w') halfPx = Math.abs(lx);
      else if (drag.mode === 'n' || drag.mode === 's') halfPx = Math.abs(ly);
      else halfPx = Math.max(Math.abs(lx), Math.abs(ly));
      let side = (2 * halfPx / MAIN_PX) * FOV;          // kpc
      const cx = (rect.x0 + rect.x1) / 2, cy = (rect.y0 + rect.y1) / 2;
      // Keep the axis-aligned square inside the FOV without moving the center.
      const maxHalf = Math.min(EXTENT[1] - cx, cx - EXTENT[0],
                               EXTENT[3] - cy, cy - EXTENT[2]);
      side = clamp(side, 1.0, Math.max(1.0, 2 * maxHalf));
      const h = side / 2;
      rect = { x0: cx - h, y0: cy - h, x1: cx + h, y1: cy + h };
    }
    render();
  });

  mainCv.addEventListener('pointerdown', (e) => {
    const { px, py } = canvasPx(mainCv, e);
    const mode = hitTest(px, py);
    if (!mode) return;
    drag = { mode, start: { x: mainXToKpc(px), y: mainYToKpc(py),
                            r: { ...rect } } };
    mainCv.style.cursor = mode === 'move' ? 'grabbing' : cursorFor(mode);
    try { mainCv.setPointerCapture(e.pointerId); } catch (_) {}
    e.preventDefault();
  });
  function endDrag(e) {
    drag = null;
    try { mainCv.releasePointerCapture(e.pointerId); } catch (_) {}
  }
  mainCv.addEventListener('pointerup', endDrag);
  mainCv.addEventListener('pointercancel', endDrag);

  // ---- zoom canvas cursor coordinate readout --------------------------------
  const zoomCoord = document.getElementById('zoomCoord');
  zoomCv.addEventListener('pointermove', (e) => {
    const { px, py } = canvasPx(zoomCv, e);
    const { x, y } = zoomPxToKpc(px, py, curXform || computeXform());
    zoomCoord.textContent = `(${x.toFixed(2)}, ${y.toFixed(2)}) kpc`;
    zoomCoord.classList.add('visible');
  });
  zoomCv.addEventListener('pointerleave', () => {
    zoomCoord.classList.remove('visible');
  });

  // ---- slider + play --------------------------------------------------------
  function setFrame(newFrame) {
    if (lastFrame === null) lastFrame = newFrame;
    const df = newFrame - lastFrame;
    if (df !== 0) applyCorotation(df);
    frameIdx = newFrame;
    lastFrame = newFrame;
    render();
  }

  slider.addEventListener('input', () => {
    setFrame(parseInt(slider.value, 10));
  });

  const speedSlider = document.getElementById('speed');
  const speedLabel = document.getElementById('speedLabel');
  let fps = parseInt(speedSlider.value, 10) || 5;
  speedLabel.textContent = fps + ' fps';

  function startPlayTimer() {
    if (playTimer) clearInterval(playTimer);
    playTimer = setInterval(() => {
      const next = frameIdx >= fmax ? fmin : frameIdx + 1;
      slider.value = next;
      setFrame(next);
    }, 1000 / fps);
  }

  playBtn.addEventListener('click', () => {
    playing = !playing;
    playBtn.textContent = playing ? 'Pause' : 'Play';
    if (playing) {
      startPlayTimer();
    } else if (playTimer) {
      clearInterval(playTimer); playTimer = null;
    }
  });

  speedSlider.addEventListener('input', () => {
    fps = parseInt(speedSlider.value, 10) || 1;
    speedLabel.textContent = fps + ' fps';
    if (playing) startPlayTimer();  // apply new speed without interrupting playback
  });

  // Toggling co-rotation should not retroactively rotate; reset the anchor.
  corotateBox.addEventListener('change', () => { lastFrame = frameIdx; });

  // Toggling "aim inset at center" re-renders with/without the rotation.
  rotateBox.addEventListener('change', render);

  const bgSelect = document.getElementById('background');
  bgSelect.addEventListener('change', () => {
    bgId = bgSelect.value;
    frames = frameCaches[bgId];
    updateLoadingUI();
    preloadFrames(bgId);
    render();
  });

  // ---- bootstrap -------------------------------------------------------------
  (async () => {
    await Promise.all([loadSne(), loadRotation()]);
    lastFrame = frameIdx;
    preloadFrames(bgId);
    // Lazy preload any other backgrounds after the active one is queued.
    for (const id of Object.keys(BG_DIRS)) {
      if (id !== bgId) preloadFrames(id);
    }
    render();
  })();
})();
</script>
</body>
</html>
